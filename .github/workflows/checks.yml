name: GP-MPC Racing checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: node --check gp_mpc_racing/static/app.js
      - run: node --check gp_mpc_racing/static/entry.js
      - run: bash -n deploy/install-course.sh
      - run: bash -n deploy/install-worker.sh
